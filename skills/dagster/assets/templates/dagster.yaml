# Production-oriented Dagster instance config. Place at $DAGSTER_HOME/dagster.yaml.
# Every section is optional; omit one to keep the default. Reference: https://docs.dagster.io/deployment/oss/dagster-yaml
# Concurrency keys: https://docs.dagster.io/guides/operate/managing-concurrency
storage:
  postgres:                              # requires the dagster-postgres package
    postgres_db:
      hostname: { env: DAGSTER_PG_HOST }
      username: { env: DAGSTER_PG_USERNAME }
      password: { env: DAGSTER_PG_PASSWORD }
      db_name: { env: DAGSTER_PG_DB }
      port: 5432

run_coordinator:
  module: dagster.core.run_coordinator
  class: QueuedRunCoordinator            # required for run-queue limits below to apply
  config:
    max_concurrent_runs: 10

concurrency:
  runs:
    max_concurrent_runs: 10              # total runs in progress
    tag_concurrency_limits:              # per-tag caps, evaluated by the daemon's run queue
      - key: "dagster/backfill"
        limit: 3
  pools:
    default_limit: 5                     # applies to any `pool="..."` on an asset/op without an explicit limit
    # granularity: run                   # default is op-level granularity

run_retries:
  enabled: true
  max_retries: 2                         # override per run with the dagster/max_retries tag
  retry_on_asset_or_op_failure: true

run_monitoring:
  enabled: true
  start_timeout_seconds: 300             # fail runs stuck in STARTING (worker never came up)
  cancel_timeout_seconds: 180            # force CANCELED if the worker does not exit
  max_runtime_seconds: 7200              # global run timeout; per-run override: dagster/max_runtime tag
  free_slots_after_run_end_seconds: 300  # release concurrency slots held by finished/cancelled runs

compute_logs:                            # stdout/stderr of runs; use a shared store on multi-node deployments
  module: dagster_aws.s3.compute_log_manager
  class: S3ComputeLogManager
  config:
    bucket: { env: DAGSTER_LOGS_BUCKET }
    prefix: compute-logs

python_logs:
  python_log_level: INFO
  managed_python_loggers:                # forward these stdlib loggers into the Dagster event log / UI
    - my_project

telemetry:
  enabled: false
